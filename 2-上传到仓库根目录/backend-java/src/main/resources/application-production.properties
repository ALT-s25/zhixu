# No embedded fallback in production: missing credentials must fail startup.
server.address=0.0.0.0
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-init-sql=SET search_path TO zhixu_backend
spring.sql.init.mode=never
zhixu.origins=${ALLOWED_ORIGINS:https://alt-s25.github.io}
