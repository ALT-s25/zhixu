name: Organize note images
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: organize-note-images
  cancel-in-progress: false
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move images and repair references
        run: python scripts/organize_images.py
      - name: Commit image organization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Organize note images and repair image paths"
          git push
