name: Restore note paths
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-note-paths
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore indexed note paths
        run: python scripts/restore_note_paths.py
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes-added notes
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore indexed note directory paths"
          git push
