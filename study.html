<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的学习 · 知序</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="study.css"><link rel="stylesheet" href="account.css"></head><body data-page="study"><a class="skip" href="#main">跳到主要内容</a><div class="shell"><aside class="sidebar"><a class="brand" href="study.html"><img src="avatars/sprout.svg" alt="">知序</a><nav aria-label="主导航"><a href="study.html" aria-current="page">我的学习</a><a href="resources.html">资源导航</a><a href="notes.html">笔记书房</a><a href="index.html#practice">算法练习</a><a href="library.html">云端笔记管理</a><a href="learning-map.html">AI 学习地图</a></nav><p>材料各有出处，学习由你做主。</p><p>游客记录保存在本机；登录后进入独立的个人云端空间。</p></aside><main class="sheet" id="main"><div class="topline"><div><h1>我的学习</h1><p class="muted">继续上次的任务，记下卡点。按自己的节奏推进。</p></div><button id="new-task" class="primary">添加任务</button></div><div class="account-strip"><strong data-account-name>游客</strong><span data-sync-status></span></div><div class="actions"><button id="sync-retry">重试同步</button><button id="migrate" hidden>导入游客记录</button><button id="use-cloud">冲突：使用云端</button><button id="use-local">冲突：保留本机</button></div><div class="toolbar"><button id="new-resource">添加自己的资源</button><select id="topic-filter" data-filter aria-label="学习主题"><option value="">全部学习主题</option></select><input id="search" type="search" aria-label="搜索" placeholder="搜索名称、方向或关键词"><select id="state" data-filter aria-label="任务状态"><option value="">全部状态</option><option value="doing">进行中</option><option value="todo">待开始</option><option value="paused">已暂停</option><option value="done">已完成</option></select></div><div class="topline"><span id="count"></span><a href="resources.html">去找学习资源 →</a></div><p id="message" role="status" aria-live="polite"></p><section id="results" class="results" aria-label="我的学习列表"></section><footer><p class="notice">游客任务和收藏在本机保存；登录后按账号同步。同步失败时保留本机副本，请留意保存状态并定期导出备份。资源介绍是选用建议，不代表已经运行验收所有项目。</p><div class="actions"><button id="backup">导出任务与收藏</button><label>恢复备份 <input id="restore" type="file" accept=".json,application/json"></label></div><p>资源失效或版本过旧？<a href="https://github.com/ALT-s25/zhixu/issues/new" target="_blank" rel="noopener noreferrer">反馈资源问题 ↗</a> · 外部内容版权归原作者，学习请前往原站。</p></footer></main></div><dialog id="editor"><form id="task-form"><h2 id="editor-title">添加学习任务</h2><label>想完成什么<input id="task-title" required maxlength="200" placeholder="例如：给登录接口补一个异常测试"></label><label>专题<input id="task-topic" maxlength="80" placeholder="例如：Java 后端 / 测试"></label><label>材料或代码链接（可选）<input id="task-url" type="url" maxlength="2000" placeholder="https://"></label><label>下一步 / 当前卡点<textarea id="task-next" maxlength="3000" placeholder="下次回来时，从哪一步继续？"></textarea></label><label>关联笔记链接（可选）<input id="task-note" type="url" maxlength="2000" placeholder="粘贴笔记页面的完整网址"></label><label>状态<select id="task-state"><option value="todo">待开始</option><option value="doing">进行中</option><option value="paused">暂停</option><option value="done">完成</option></select></label><div class="actions"><button class="primary" type="submit">保存任务</button><button type="button" id="close-editor">取消</button></div></form></dialog><dialog id="resource-editor"><form id="resource-form"><h2>我的资源</h2><label>名称<input id="resource-title" required maxlength="200"></label><label>网址<input id="resource-url" type="url" required maxlength="2000"></label><label>学习主题<input id="resource-topic" maxlength="80" placeholder="例如：Java 实习准备"></label><label>为什么留着它<textarea id="resource-description" maxlength="2000"></textarea></label><div class="actions"><button type="submit">保存资源</button><button type="button" id="cancel-resource">取消</button></div></form></dialog><script src="data.js"></script><script src="growth-core.js"></script><script src="cloud-config.js"></script><script src="library-session.js"></script><script src="account.js"></script><script type="module" src="study-app.mjs"></script></body></html>
