<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资源导航 · 知序</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="study.css"><link rel="stylesheet" href="account.css"><link rel="stylesheet" href="site-design.css?v=20261116"></head><body data-page="resources"><a class="skip" href="#main">跳到主要内容</a><div class="shell"><aside class="sidebar"><a class="brand" href="study.html"><img src="avatars/sprout.svg" alt="">知序</a><nav aria-label="主导航"><a href="study.html">我的学习</a><a href="resources.html" aria-current="page">资源导航</a><a href="notes.html">笔记书房</a><a href="experiments.html">项目实验</a><a href="index.html#practice">算法练习</a><a href="library.html">云端笔记管理</a><a href="learning-map.html">AI 学习地图</a></nav><p>材料各有出处，学习由你做主。</p><p>游客记录保存在本机；登录后进入独立的个人云端空间。</p></aside><main class="sheet" id="main"><div class="topline"><div><h1>资源导航</h1><p class="muted">找到适合当前问题的材料。笔记独立保存在笔记书房。</p></div><button id="new-task" class="primary">添加任务</button></div><div class="account-strip"><strong data-account-name>游客</strong><span data-sync-status></span></div><div class="actions"><button id="sync-retry">重试同步</button><button id="migrate" hidden>导入游客记录</button><button id="use-cloud">冲突：使用云端</button><button id="use-local">冲突：保留本机</button></div><div class="actions" aria-label="实用工具快捷分类"><button data-tool-category="">全部工具</button><button data-tool-category="开发调试">开发调试</button><button data-tool-category="接口调试">接口调试</button><button data-tool-category="数据库工具">数据库工具</button><button data-tool-category="图表设计">图表设计</button><button data-tool-category="图片处理">图片处理</button><button data-tool-category="文档办公">文档办公</button><button data-tool-category="阅读研究">阅读研究</button><button data-tool-category="语言写作">语言写作</button><button data-tool-category="求职工具">求职工具</button></div><div class="toolbar"><button id="student-start">新手从这里找</button><label><input type="checkbox" id="beginner" data-filter>只看新手友好</label><button id="new-resource">添加自己的资源</button><select id="topic-filter" data-filter aria-label="学习主题"><option value="">全部学习主题</option></select><input id="search" type="search" aria-label="搜索" placeholder="搜索名称、方向或关键词"><select id="category" data-filter aria-label="技术方向"><option value="">全部方向</option></select><select id="type" data-filter aria-label="资源类型"><option value="">全部类型</option></select><select id="level" data-filter aria-label="学习阶段"><option value="">全部阶段</option></select><label><input id="favorites" data-filter type="checkbox"> 只看收藏</label><label><input id="compact" type="checkbox"> 紧凑列表</label><button id="clear">清空筛选</button></div><div class="topline"><span id="count"></span><a href="study.html">查看我的学习 →</a></div><p id="message" role="status" aria-live="polite"></p><section id="results" class="results" aria-label="资源导航列表"></section><footer><p class="notice">游客任务和收藏在本机保存；登录后按账号同步。同步失败时保留本机副本，请留意保存状态并定期导出备份。资源介绍是选用建议，不代表已经运行验收所有项目。</p><div class="actions"><button id="backup">导出任务与收藏</button><label>恢复备份 <input id="restore" type="file" accept=".json,application/json"></label></div><p>资源失效或版本过旧？<a href="https://github.com/ALT-s25/zhixu/issues/new" target="_blank" rel="noopener noreferrer">反馈资源问题 ↗</a> · 外部内容版权归原作者，学习请前往原站。</p></footer></main></div><dialog id="editor"><form id="task-form"><h2 id="editor-title">添加学习任务</h2><label>想完成什么<input id="task-title" required maxlength="200" placeholder="例如：给登录接口补一个异常测试"></label><label>专题<input id="task-topic" maxlength="80" placeholder="例如：Java 后端 / 测试"></label><label>材料或代码链接（可选）<input id="task-url" type="url" maxlength="2000" placeholder="https://"></label><label>下一步 / 当前卡点<textarea id="task-next" maxlength="3000" placeholder="下次回来时，从哪一步继续？"></textarea></label><label>关联笔记链接（可选）<input id="task-note" type="url" maxlength="2000" placeholder="粘贴笔记页面的完整网址"></label><fieldset><legend>任务安排</legend><label>类型<select id="task-kind"><option>学习</option><option>算法</option><option>项目</option><option>考试</option><option>活动</option><option>其他</option></select></label><label>进度（%）<input id="task-progress" type="number" min="0" max="100" value="0"></label><label>计划日期<input id="task-day" type="date"></label><label>开始时间<input id="task-start" type="time"></label><label>结束时间<input id="task-end" type="time"></label><label>截止时间<input id="task-deadline" type="datetime-local"></label><small>按设备本地时区安排；这里只保存日期，暂不发送通知。</small></fieldset><label>状态<select id="task-state"><option value="todo">待开始</option><option value="doing">进行中</option><option value="paused">暂停</option><option value="done">完成</option></select></label><div class="actions"><button class="primary" type="submit">保存任务</button><button type="button" id="close-editor">取消</button></div></form></dialog><dialog id="resource-editor"><form id="resource-form"><h2>我的资源</h2><label>名称<input id="resource-title" required maxlength="200"></label><label>网址<input id="resource-url" type="url" required maxlength="2000"></label><label>学习主题<input id="resource-topic" maxlength="80" placeholder="例如：Java 实习准备"></label><label>为什么留着它<textarea id="resource-description" maxlength="2000"></textarea></label><div class="actions"><button type="submit">保存资源</button><button type="button" id="cancel-resource">取消</button></div></form></dialog><script src="data.js"></script><script src="growth-core.js"></script><script src="cloud-config.js"></script><script src="library-session.js"></script><script src="account.js"></script><script type="module" src="study-app.mjs"></script></body></html>
